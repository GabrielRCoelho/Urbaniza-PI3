<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbaniza</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <header>
        <img src="./assets/Logo.svg" alt="Logo da Urbaniza" class="logo">   
    </header>

    <main>
        <h1>Entre para avaliar <br>sua região</h1>
        <p>
            Sua participação ajuda a construir uma <br>São Paulo melhor para todos.
        </p>
        <form>
            <div class="campo">
                <img src="./assets/Email.svg" alt="" class="icone">
                <input type="text" name="email" placeholder="E-mail" arial-label="E-mail" required>
            </div>
            
            <div class="campo">
                <img src="./assets/Cadeado.svg" alt="" class="icone">
                <input type="password" name="senha" placeholder="Senha" arial-label="Senha" required>
                <button type="button" class="mostrar-senha" aria-label="Mostrar senha">
                <img src="./assets/Olho.svg" alt="" class="icone">
            </button>
            </div>
            <button type="submit">Entrar</button>
            <a href="Cadastro.html" class="criar-conta">Criar conta</a>
            <a href="RecuperarSenha.html" class="recuperar-senha">Esqueci minha senha</a>
        </form>


    </main>
    
</body>
</html>
