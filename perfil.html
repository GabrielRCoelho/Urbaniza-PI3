<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Urbaniza</title>
  <link rel="stylesheet" href="Style_perfil.css">
</head>
<body>
  <div class="app">

    <header class="topo">
      <img src="./assets/Logo.svg" alt="Urbaniza – São Paulo melhor começa com você!" class="logo">
    </header>

    <main class="conteudo">
      <a href="#" class="card-usuario" aria-label="Carlos Lins">
        <span class="avatar" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="24" r="11" fill="#8a97ad"/>
            <path d="M10 62c0-13 9-20 22-20s22 7 22 20z" fill="#8a97ad"/>
          </svg>
        </span>

        <span class="dados">
          <strong class="nome">Carlos Lins</strong>
          <span class="email">carlos.eslins@senacsp.edu.br</span>
          <span class="local">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            São Paulo • SP
          </span>
        </span>

        <svg class="seta" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>

      <section class="suporte" aria-labelledby="titulo-suporte">
        <h2 id="titulo-suporte">Suporte</h2>
        <a href="Index.html" class="btn btn-sair">Sair da conta</a>
        <button type="button" class="btn btn-excluir" popovertarget="modal-excluir">Excluir conta</button>
      </section>
    </main>
    
    <div id="modal-excluir" class="modal" popover aria-labelledby="modal-titulo">
        <h2 id="modal-titulo">Excluir conta?</h2>
        <p>Essa ação não pode ser desfeita. Suas avaliações e dados serão apagados.</p>
        <div class="modal-acoes">
          <button type="button" class="btn btn-cancelar"
                  popovertarget="modal-excluir" popovertargetaction="hide">
            Cancelar
          </button>
          <a href="Index.html" class="btn btn-excluir">Sim, excluir</a>
        </div>
      </div>

  </div>

  <footer class="rodape-fixo">
    <nav class="menu-inferior" aria-label="Navegação principal">
        <a href="inicio.html" class="item-menu-ativo">
            <img src="./assets/inicio-desativado.svg" alt="Inicio" class="icone-menu">
            <span>Inicio</span>
        </a>
        <a href="mapa.html" class="item-menu-ativo">
            <img src="./assets/mapa.svg" alt="Mapa" class="icone-menu">
            <span>Mapa</span>
        </a>
        <a href="avaliacoes.html" class="item-menu-ativo">
            <img src="./assets/avaliacoes.svg" alt="Avaliações" class="icone-menu">
            <span>Avaliações</span>
        </a>
        <a href="perfil.html" class="item-menu ativo">
            <img src="./assets/perfil-ativo.svg" alt="Perfil" class="icone-menu">
            <span>Perfil</span>
        </a>
    </nav>
</footer>

</body>
</html>
